name: ResumeIQ AI - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Check application starts
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from app import create_app
        app = create_app()
        client = app.test_client()
        pages = ['/', '/builder', '/analyzer', '/matcher', '/dashboard', '/templates', '/about', '/login', '/register', '/interview']
        for page in pages:
            resp = client.get(page)
            assert resp.status_code == 200, f'{page} returned {resp.status_code}'
        print('All pages render successfully')
        "

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: resumeiq-ai:latest
    
    - name: Verify Docker image
      run: |
        docker run --rm resumeiq-ai:latest python -c "
        import sys
        sys.path.insert(0, '/app')
        from app import create_app
        app = create_app()
        print('Docker image verified successfully')
        "

