{% extends "base.html" %}

{% block title %}Forgot Password — ResumeIQ AI{% endblock %}

{% block content %}
<div class="container section" style="max-width: 480px;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div class="hero-tag"><i class="fa-solid fa-key"></i> Password Reset</div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.4rem;">Forgot Password</h1>
    <p style="color: var(--muted);">Enter your email and we'll help you reset your password</p>
  </div>

  <div class="card" style="padding: 2rem;">
    <form id="forgot-form">
      <div id="auth-error" style="background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.4); color: var(--danger); padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="auth-error-message"></span>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="forgot-email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <button type="submit" id="forgot-btn" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-paper-plane"></i> SEND RESET LINK
      </button>

      <div style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: var(--muted);">
        <p><a href="/login" style="color: var(--primary); font-weight: 600;">Back to Sign In</a></p>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("forgot-form");
  const errorDiv = document.getElementById("auth-error");
  const errorMsg = document.getElementById("auth-error-message");
  const btn = document.getElementById("forgot-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorDiv.style.display = "none";

    const email = document.getElementById("forgot-email").value.trim();

    if (!email) {
      errorMsg.textContent = "Please enter your email address.";
      errorDiv.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';

    // For local mode, show success message since email sending requires SMTP setup
    setTimeout(() => {
      errorDiv.style.background = "rgba(52, 211, 153, 0.12)";
      errorDiv.style.borderColor = "rgba(52, 211, 153, 0.4)";
      errorDiv.style.color = "var(--success)";
      errorMsg.textContent = "If an account exists with this email, a password reset link would be sent. Please contact support for assistance in local mode.";
      errorDiv.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> SEND RESET LINK';
    }, 1000);
  });
});
</script>
{% endblock %}
